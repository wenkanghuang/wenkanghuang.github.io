<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="个人学术成果、设计实践与荣誉展示主页。">
  <title>个人学术主页｜Academic Portfolio</title>
  <link rel="stylesheet" href="style.css?v=20261031-4">
  <script src="script.js?v=20261031-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <nav class="primary-nav" aria-label="主要页面">
    <button class="nav-link is-active" type="button" data-page="research" aria-current="page">科研成果 <span>Research</span></button>
    <button class="nav-link" type="button" data-page="design">设计实践 <span>Design</span></button>
    <button class="nav-link" type="button" data-page="awards">荣誉与其他 <span>Awards &amp; More</span></button>
  </nav>

  <main id="main-content">
    <section class="profile-shell" aria-labelledby="profile-name">
      <div class="profile-photo" id="profile-photo" aria-hidden="true"><span>PHOTO</span></div>
      <div class="profile-intro">
        <h1 id="profile-name">个人信息待补充</h1>
        <p class="profile-role" id="profile-role">学校 / 专业 / 学历</p>
        <p class="profile-bio" id="profile-bio" hidden></p>
      </div>
      <div class="profile-actions" id="profile-actions"></div>
    </section>

    <section class="page is-active" id="research" data-page-panel="research" aria-labelledby="research-title">
      <div class="section-heading">
        <div><p class="eyebrow">01 / Selected scholarship</p><h2 id="research-title">科研成果</h2></div>
      </div>
      <div class="stats-grid research-stats" id="research-stats" aria-label="科研成果统计"></div>
      <div class="masonry-grid" id="research-grid" aria-live="polite"></div>
    </section>

    <section class="page" id="design" data-page-panel="design" aria-labelledby="design-title" hidden>
      <div class="section-heading">
        <div><p class="eyebrow">02 / Design practice</p><h2 id="design-title">设计实践</h2></div>
        <p>用于展示经过确认的设计项目、角色、过程和成果。当前仅建立内容结构。</p>
      </div>
      <div class="stats-grid" id="design-stats" aria-label="设计实践统计"></div>
      <div class="masonry-grid" id="design-grid"></div>
    </section>

    <section class="page" id="awards" data-page-panel="awards" aria-labelledby="awards-title" hidden>
      <div class="section-heading">
        <div><p class="eyebrow">03 / Recognition &amp; more</p><h2 id="awards-title">个人荣誉与其他</h2></div>
        <p>国家级、省级与其他荣誉将依据真实数据自动统计。当前仅建立内容结构。</p>
      </div>
      <div class="stats-grid" id="awards-stats" aria-label="荣誉统计"></div>
      <div class="masonry-grid" id="awards-grid"></div>
    </section>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="detail-drawer" id="detail-drawer" aria-labelledby="detail-title" aria-hidden="true">
    <button class="drawer-close" id="drawer-close" type="button" aria-label="收起论文详情">←</button>
    <div id="detail-content"></div>
  </aside>

  <div class="stats-backdrop" id="stats-backdrop" hidden></div>
  <aside class="stats-popover" id="stats-popover" role="dialog" aria-modal="true" aria-labelledby="stats-popover-title" aria-hidden="true">
    <button class="stats-close" id="stats-close" type="button" aria-label="关闭统计详情">×</button>
    <p class="eyebrow" id="stats-popover-label"></p>
    <h3 id="stats-popover-title">统计详情</h3>
    <div id="stats-popover-content"></div>
  </aside>
  <div class="status-toast" id="status-toast" role="status" hidden></div>
</body>
</html>
